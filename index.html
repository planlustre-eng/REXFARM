<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>質感像素恐龍記帳</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pixelBg: '#181A1B',
            pixelCard: '#222529',
            pixelAccent: '#52B788',
            pixelGold: '#F4A261',
            pixelRed: '#E63946',
            pixelText: '#E9ECEF'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0F1011;
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      touch-action: manipulation;
    }
    
    .pixelated {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .pixel-font {
      font-family: 'Press Start 2P', monospace;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes pixelBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .pixel-dino-anim {
      animation: pixelBounce 0.9s steps(2) infinite;
    }

    /* 恐龍行走動畫 */
    #dinoContainer {
      transition: left 0.3s linear, transform 0.2s ease;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen sm:py-4">

  <!-- 手機外框容器 -->
  <div class="w-full max-w-md h-[100vh] sm:h-[844px] bg-pixelBg text-pixelText sm:rounded-[32px] shadow-2xl flex flex-col overflow-hidden relative border-gray-800 sm:border-4">
    
    <!-- 頂部精簡 Header -->
    <header class="bg-pixelCard px-4 py-2.5 flex justify-between items-center border-b border-gray-800 z-10 flex-shrink-0">
      <div class="flex items-center gap-2">
        <span class="pixel-font text-[10px] text-pixelAccent tracking-widest">DINO PARK</span>
        <span class="text-[10px] bg-gray-800 text-pixelGold px-2 py-0.5 rounded border border-gray-700">等級 <span id="farmLevel">1</span></span>
      </div>
      <div class="text-[11px] flex items-center gap-2">
        <button onclick="spawnMeatFromHeader()" class="text-gray-300 hover:text-white bg-gray-800/80 px-2 py-0.5 rounded border border-gray-700">
          🍖 肉乾 <strong id="feedCount" class="text-pixelGold">3</strong>
        </button>
        <button onclick="exportCSV()" class="bg-gray-800 hover:bg-gray-700 text-pixelText border border-gray-600 text-[10px] py-0.5 px-2.5 rounded transition">匯出資料</button>
      </div>
    </header>

    <!-- 藍天綠地像素恐龍公園橫幅 (140px) -->
    <div id="parkArea" onclick="handleParkClick(event)" class="border-b-2 border-gray-800 relative overflow-hidden flex-shrink-0 h-[140px] flex flex-col justify-between pixelated select-none cursor-pointer">
      
      <!-- 天空背景 -->
      <div class="absolute inset-0 bg-[#70C5CE] z-0"></div>

      <!-- 像素白雲 -->
      <div class="absolute top-2 left-4 w-12 h-4 opacity-80 z-0">
        <svg viewBox="0 0 24 8" class="w-full h-full pixelated">
          <path d="M4 2 h16 v2 h-16 z M2 4 h20 v2 h-20 z" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="absolute top-4 right-8 w-16 h-5 opacity-70 z-0">
        <svg viewBox="0 0 24 8" class="w-full h-full pixelated">
          <path d="M4 2 h16 v2 h-16 z M2 4 h20 v2 h-20 z" fill="#FFFFFF"/>
        </svg>
      </div>

      <!-- 遠處遠山 -->
      <div class="absolute bottom-6 left-0 right-0 h-10 z-0">
        <svg viewBox="0 0 100 25" preserveAspectRatio="none" class="w-full h-full pixelated">
          <polygon points="0,25 15,8 35,25" fill="#2D6A4F" />
          <polygon points="25,25 50,5 75,25" fill="#1B4332" />
          <polygon points="60,25 80,10 100,25" fill="#2D6A4F" />
        </svg>
      </div>

      <!-- 草皮 -->
      <div class="absolute bottom-0 left-0 right-0 h-8 bg-[#52B788] border-t-2 border-[#40916C] z-0">
        <div class="w-full h-1 bg-[#74C69D]"></div>
      </div>

      <!-- 頂部資訊條：半透明連續記帳 + 半透明恐龍互動對話框 -->
      <div class="flex items-center gap-1.5 p-2 z-10 relative">
        <div class="text-[10px] bg-black/50 backdrop-blur-sm text-white px-2 py-1 rounded border border-white/10 shrink-0">
          連續 3 天
        </div>

        <!-- 半透明互動對話框 -->
        <div id="dialogBox" class="flex-1 bg-black/50 backdrop-blur-sm border border-white/10 rounded px-2 py-1 text-[10px] text-white flex justify-between items-center overflow-hidden">
          <span id="dialogText" class="truncate">點擊草地放置肉乾餵食恐龍（雙擊改名）</span>
          <button onclick="closeDialog(event)" class="text-gray-400 hover:text-white ml-1 shrink-0">✕</button>
        </div>

        <!-- 獎勵提示 -->
        <div id="farmToast" class="hidden bg-pixelGold text-black text-[10px] px-2 py-1 font-bold border border-black shadow shrink-0">
          肉乾 +1
        </div>
      </div>

      <!-- 恐龍與物件區域 (絕對定位以支援行走) -->
      <div class="relative w-full h-16 z-10 mb-1">
        
        <!-- 恐龍巢穴 (固定左側) -->
        <div onclick="clickNest(event)" class="absolute left-4 bottom-0 text-center group cursor-pointer z-10">
          <div class="text-xl transition-transform group-hover:scale-105">🌋</div>
          <span class="text-[8px] bg-black/50 backdrop-blur-sm text-white px-1 py-0.2 rounded border border-white/10">巢穴</span>
        </div>

        <!-- 帶骨頭的肉乾 (動態放置) -->
        <div id="meatItem" class="hidden absolute bottom-2 z-10 -translate-x-1/2 transition-all duration-300">
          <div class="w-5 h-5">
            <svg viewBox="0 0 16 16" class="w-full h-full pixelated">
              <!-- 骨頭兩端 -->
              <path d="M1 7 h2 v2 h-2 z M13 7 h2 v2 h-2 z" fill="#FFFFFF"/>
              <!-- 肉身 -->
              <path d="M3 5 h10 v6 h-10 z" fill="#E63946"/>
              <path d="M5 6 h6 v4 h-6 z" fill="#C5221F"/>
              <path d="M4 8 h2 v2 h-2 z" fill="#F4A261"/>
            </svg>
          </div>
        </div>

        <!-- 8-bit 像素小恐龍 (可移動) -->
        <div id="dinoContainer" 
             onclick="clickDino(event)" 
             ondblclick="renameDino(event)" 
             class="absolute bottom-0 text-center group cursor-pointer z-20 -translate-x-1/2" 
             style="left: 50%;">
          <div id="dinoSprite" class="w-9 h-9 mx-auto relative pixel-dino-anim">
            <svg viewBox="0 0 16 16" class="w-full h-full pixelated">
              <!-- 恐龍身體 (綠) -->
              <path d="M7 2 h5 v2 h-5 z M6 4 h7 v2 h-7 z M5 6 h8 v2 h-8 z M4 8 h9 v4 h-9 z M3 10 h2 v3 h-2 z" fill="#52B788"/>
              <!-- 背脊 (深綠) -->
              <path d="M6 2 h1 v1 h-1 z M5 4 h1 v1 h-1 z M4 6 h1 v1 h-1 z" fill="#1B4332"/>
              <!-- 肚皮 (淺綠/黃) -->
              <path d="M8 9 h3 v3 h-3 z" fill="#B7E4C7"/>
              <!-- 眼睛 (黑) -->
              <path d="M10 3 h1 v1 h-1 z" fill="#000"/>
              <!-- 手腳 (綠/橘) -->
              <path d="M11 8 h2 v1 h-2 z M5 12 h2 v2 h-2 z M9 12 h2 v2 h-2 z" fill="#40916C"/>
            </svg>
          </div>
          <span id="dinoNameLabel" class="text-[8px] bg-black/50 backdrop-blur-sm text-pixelGold px-1 py-0.2 rounded border border-pixelGold/30">雷克斯</span>
        </div>

        <!-- 恐龍蛋 (固定右側，顯示孵化剩餘天數) -->
        <div onclick="clickEgg(event)" class="absolute right-4 bottom-0 text-center group cursor-pointer z-10">
          <div class="text-xl transition-transform group-hover:scale-105">🥚</div>
          <span class="text-[8px] bg-black/50 backdrop-blur-sm text-white px-1 py-0.2 rounded border border-white/10">孵化中 <strong id="eggDaysLeft" class="text-pixelGold">3</strong>天</span>
        </div>

      </div>

    </div>

    <!-- 主要內容區 -->
    <main class="flex-1 overflow-y-auto p-3.5 space-y-3.5 no-scrollbar pb-20" id="mainContent">

      <!-- 頁籤一：總覽與明細 -->
      <section id="tab-overview" class="space-y-3.5">
        
        <!-- 資產數據看板 -->
        <div class="bg-pixelCard rounded-xl p-3.5 border border-gray-800 space-y-3">
          <div>
            <div class="text-[11px] text-gray-400 tracking-wide">本月淨結餘</div>
            <div class="text-2xl font-bold text-pixelAccent mt-0.5" id="statBalance">$ 0</div>
          </div>
          
          <div class="grid grid-cols-2 gap-3 pt-2.5 border-t border-gray-800/80 text-[12px]">
            <div>
              <span class="text-gray-400 text-[10px] block">累積收入</span>
              <span class="text-pixelAccent font-semibold" id="statIncome">$ 0</span>
            </div>
            <div>
              <span class="text-gray-400 text-[10px] block">累積支出</span>
              <span class="text-pixelRed font-semibold" id="statExpense">$ 0</span>
            </div>
          </div>
        </div>

        <!-- 預算進度條 -->
        <div class="bg-pixelCard p-3.5 rounded-xl border border-gray-800 space-y-2">
          <div class="flex justify-between items-center text-xs">
            <span class="font-medium text-gray-200">本月財務配額</span>
            <button onclick="openBudgetModal()" class="text-[11px] text-pixelGold hover:underline">調整配額</button>
          </div>

          <div class="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-gray-700">
            <div id="budgetProgressBar" class="bg-pixelAccent h-full rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>

          <div class="flex justify-between text-[10px] text-gray-400">
            <span>已使用 <strong id="budgetUsedPercent" class="text-gray-200">0%</strong></span>
            <span>剩餘額度 $<strong id="budgetRemaining" class="text-gray-200">0</strong></span>
          </div>
        </div>

        <!-- 支出類別占比圓餅圖 -->
        <div class="bg-pixelCard p-3.5 rounded-xl border border-gray-800">
          <div class="text-xs font-medium text-gray-200 mb-2">支出結構分析</div>
          <div class="h-36 relative flex justify-center items-center">
            <canvas id="categoryChart"></canvas>
          </div>
        </div>

        <!-- 動態歷程紀錄 -->
        <div class="space-y-2">
          <div class="flex justify-between items-center px-0.5">
            <span class="text-xs font-medium text-gray-400">近期交易紀錄</span>
          </div>
          <div id="recordList" class="space-y-2">
            <!-- 動態渲染紀錄 -->
          </div>
        </div>

      </section>

      <!-- 頁籤二：類別管理 -->
      <section id="tab-categories" class="hidden space-y-3.5">
        <div class="bg-pixelCard p-3.5 rounded-xl border border-gray-800 space-y-2.5">
          <span class="text-xs font-medium text-gray-200 block">新增自訂類別</span>
          <div class="flex gap-2">
            <input type="text" id="newCategoryInput" placeholder="輸入類別名稱..." class="flex-1 bg-gray-900/80 px-3 py-1.5 text-xs text-white border border-gray-700 focus:border-pixelAccent outline-none rounded-lg" />
            <button onclick="addCustomCategory()" class="bg-pixelAccent hover:bg-emerald-600 text-gray-950 font-medium text-xs px-3.5 py-1.5 rounded-lg transition">新增</button>
          </div>
        </div>

        <div class="bg-pixelCard p-3.5 rounded-xl border border-gray-800">
          <span class="text-xs font-medium text-gray-200 block mb-2">現有類別列表</span>
          <div id="categoryList" class="divide-y divide-gray-800/60">
            <!-- 動態渲染類別 -->
          </div>
        </div>
      </section>

    </main>

    <!-- 底部導覽列 -->
    <nav class="bg-pixelCard border-t border-gray-800 px-8 py-2 flex justify-around items-center absolute bottom-0 w-full z-10">
      <button onclick="switchTab('overview')" id="nav-overview" class="flex flex-col items-center gap-1 text-pixelAccent">
        <span class="text-xs font-medium">總覽紀錄</span>
      </button>

      <!-- 新增紀錄按鈕 -->
      <button onclick="openAddModal()" class="bg-pixelGold hover:bg-amber-600 text-gray-950 text-xl font-bold w-10 h-10 rounded-full flex items-center justify-center -mt-5 border-2 border-pixelBg shadow-lg transition active:scale-95">
        ＋
      </button>

      <button onclick="switchTab('categories')" id="nav-categories" class="flex flex-col items-center gap-1 text-gray-400">
        <span class="text-xs font-medium">類別管理</span>
      </button>
    </nav>

    <!-- 新增紀錄 Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex justify-end flex-col z-50 hidden">
      <div class="bg-pixelCard rounded-t-2xl p-3.5 space-y-3 border-t border-gray-700 max-w-md mx-auto w-full">
        
        <div class="flex justify-between items-center border-b border-gray-800 pb-1.5">
          <div class="flex gap-2">
            <button id="btnTypeExpense" onclick="setType('支出')" class="text-xs py-1 px-3.5 rounded-lg font-medium transition bg-pixelRed text-white">支出</button>
            <button id="btnTypeIncome" onclick="setType('收入')" class="text-xs py-1 px-3.5 rounded-lg font-medium transition bg-gray-800 text-gray-300">收入</button>
          </div>
          <button onclick="closeAddModal()" class="text-gray-400 hover:text-white text-base px-1">✕</button>
        </div>

        <div class="space-y-2.5">
          <!-- 金額輸入 -->
          <div>
            <label class="text-[10px] text-gray-400 block mb-0.5">交易金額</label>
            <div class="bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-1.5 flex items-center">
              <span class="text-gray-400 mr-2 text-xs">$</span>
              <input type="number" id="inputAmount" inputmode="numeric" pattern="[0-9]*" placeholder="0" class="bg-transparent w-full text-base font-bold text-pixelGold outline-none" />
            </div>
          </div>

          <!-- 類別選擇 -->
          <div>
            <label class="text-[10px] text-gray-400 block mb-0.5">交易類別</label>
            <div id="categoryChips" class="flex gap-1.5 overflow-x-auto pb-0.5 no-scrollbar">
              <!-- 動態生成純文字類別標籤 -->
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] text-gray-400 block mb-0.5">日期</label>
              <input type="date" id="inputDate" class="w-full bg-gray-900 text-xs p-1.5 text-white border border-gray-700 rounded-lg outline-none" />
            </div>
            <div>
              <label class="text-[10px] text-gray-400 block mb-0.5">備註說明</label>
              <input type="text" id="inputNote" placeholder="細節..." class="w-full bg-gray-900 text-xs p-1.5 text-white border border-gray-700 rounded-lg outline-none" />
            </div>
          </div>
        </div>

        <button onclick="saveRecord()" class="w-full bg-pixelAccent hover:bg-emerald-600 text-gray-950 font-bold text-xs py-2 rounded-lg transition mt-1">
          完成紀錄（餵養恐龍 肉乾 +1）
        </button>
      </div>
    </div>

    <!-- 預算 Modal -->
    <div id="budgetModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm flex justify-center items-center p-4 z-50 hidden">
      <div class="bg-pixelCard rounded-xl p-4 w-full max-w-xs space-y-3.5 border border-gray-700">
        <h3 class="font-medium text-xs text-gray-200 border-b border-gray-800 pb-2">調整財務配額</h3>
        
        <div>
          <label class="text-[10px] text-gray-400 block mb-1">月度預算上限</label>
          <input type="number" id="budgetAmountInput" inputmode="numeric" pattern="[0-9]*" placeholder="例如：20000" class="w-full bg-gray-900 text-xs p-2.5 text-white border border-gray-700 rounded-lg outline-none" />
        </div>

        <div class="flex gap-2 pt-1">
          <button onclick="closeBudgetModal()" class="flex-1 bg-gray-800 text-gray-300 py-1.5 text-xs rounded-lg">取消</button>
          <button onclick="saveBudget()" class="flex-1 bg-pixelAccent text-gray-950 font-medium py-1.5 text-xs rounded-lg">儲存設定</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let records = JSON.parse(localStorage.getItem('app_records_dino')) || [
      { id: 1, type: '支出', amount: 120, category: '餐飲', date: '2026-09-11', note: '午餐' },
      { id: 2, type: '支出', amount: 55, category: '交通', date: '2026-09-11', note: '捷運' },
      { id: 3, type: '收入', amount: 50000, category: '薪資', date: '2026-09-01', note: '月薪入帳' }
    ];

    let categories = JSON.parse(localStorage.getItem('app_categories_dino')) || [
      { name: '餐飲' },
      { name: '交通' },
      { name: '購物' },
      { name: '居住' },
      { name: '娛樂' },
      { name: '薪資' }
    ];

    let budget = JSON.parse(localStorage.getItem('app_budget_dino')) || { amount: 20000 };
    let farmState = JSON.parse(localStorage.getItem('app_farm_dino')) || { 
      level: 1, 
      feed: 3, 
      dinoName: '雷克斯',
      eggDays: 3,
      dinoPosPercent: 50
    };

    let currentType = '支出';
    let selectedCategory = '餐飲';
    let chartInstance = null;
    let isMoving = false;

    window.onload = () => {
      document.getElementById('inputDate').valueAsDate = new Date();
      renderAll();
    };

    function saveToStorage() {
      localStorage.setItem('app_records_dino', JSON.stringify(records));
      localStorage.setItem('app_categories_dino', JSON.stringify(categories));
      localStorage.setItem('app_budget_dino', JSON.stringify(budget));
      localStorage.setItem('app_farm_dino', JSON.stringify(farmState));
    }

    function renderAll() {
      renderRecords();
      renderBudget();
      renderCategoryChips();
      renderCategoryManagement();
      renderChart();
      renderFarm();
      saveToStorage();
    }

    function renderFarm() {
      document.getElementById('farmLevel').innerText = farmState.level;
      document.getElementById('feedCount').innerText = farmState.feed;
      document.getElementById('dinoNameLabel').innerText = farmState.dinoName || '雷克斯';
      document.getElementById('eggDaysLeft').innerText = farmState.eggDays !== undefined ? farmState.eggDays : 3;
      
      const dino = document.getElementById('dinoContainer');
      dino.style.left = `${farmState.dinoPosPercent || 50}%`;
    }

    /* --- 恐龍餵養與動態行走邏輯 --- */
    function handleParkClick(e) {
      if (e.target.closest('#dinoContainer') || e.target.closest('#dialogBox') || e.target.closest('button')) return;

      const park = document.getElementById('parkArea');
      const rect = park.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const targetPercent = Math.max(15, Math.min(85, (clickX / rect.width) * 100));

      dropMeatAndWalk(targetPercent);
    }

    function spawnMeatFromHeader() {
      let targetPercent = (farmState.dinoPosPercent || 50) + 20;
      if (targetPercent > 85) targetPercent = (farmState.dinoPosPercent || 50) - 20;
      dropMeatAndWalk(targetPercent);
    }

    function dropMeatAndWalk(targetPercent) {
      if (farmState.feed <= 0) {
        showDialog('肉乾不足了！新增一筆記帳即可獲得肉乾 🍖');
        return;
      }

      if (isMoving) return;

      farmState.feed -= 1;
      renderFarm();

      const meatItem = document.getElementById('meatItem');
      meatItem.style.left = `${targetPercent}%`;
      meatItem.classList.remove('hidden');

      const dino = document.getElementById('dinoContainer');
      const dinoSprite = document.getElementById('dinoSprite');
      const currentPercent = farmState.dinoPosPercent || 50;

      if (targetPercent < currentPercent) {
        dinoSprite.style.transform = 'scaleX(-1)';
      } else {
        dinoSprite.style.transform = 'scaleX(1)';
      }

      showDialog(`${farmState.dinoName} 看到了肉肉，正趕過去！`);
      isMoving = true;

      setTimeout(() => {
        dino.style.left = `${targetPercent}%`;
        farmState.dinoPosPercent = targetPercent;
      }, 50);

      setTimeout(() => {
        meatItem.classList.add('hidden');
        showDialog(`嗷嗚～ ${farmState.dinoName} 吃掉了肉乾！美味＋1 🍖`);
        isMoving = false;
        
        if (Math.random() > 0.6) {
          farmState.level += 1;
          renderFarm();
          showDialog(`🎉 ${farmState.dinoName} 升到了 Level ${farmState.level}！`);
        }
      }, 600);
    }

    /* --- 恐龍與物件互動 --- */
    function clickDino(e) {
      e.stopPropagation();
      showDialog(`吼～ 我是 ${farmState.dinoName}！點擊草地餵我吃肉肉，雙擊可以幫我改名字喔！`);
    }

    function renameDino(e) {
      e.stopPropagation();
      const newName = prompt('請輸入小恐龍的新名字：', farmState.dinoName || '雷克斯');
      if (newName && newName.trim() !== '') {
        farmState.dinoName = newName.trim();
        renderFarm();
        showDialog(`名字成功修改為「${farmState.dinoName}」！吼吼～`);
      }
    }

    function clickNest(e) {
      e.stopPropagation();
      showDialog('火山巢穴：持續記帳即可打造成為壯觀的恐龍王國！');
    }

    function clickEgg(e) {
      e.stopPropagation();
      showDialog(`恐龍蛋：還需要 ${farmState.eggDays} 天就能孵化出新品種小恐龍！`);
    }

    function showDialog(msg) {
      document.getElementById('dialogText').innerText = msg;
      document.getElementById('dialogBox').classList.remove('hidden');
    }

    function closeDialog(e) {
      if(e) e.stopPropagation();
      document.getElementById('dialogBox').classList.add('hidden');
    }

    /* --- 頁籤與紀錄選單 --- */
    function switchTab(tab) {
      document.getElementById('tab-overview').classList.toggle('hidden', tab !== 'overview');
      document.getElementById('tab-categories').classList.toggle('hidden', tab !== 'categories');
      
      document.getElementById('nav-overview').className = tab === 'overview' ? 'flex flex-col items-center gap-1 text-pixelAccent' : 'flex flex-col items-center gap-1 text-gray-400';
      document.getElementById('nav-categories').className = tab === 'categories' ? 'flex flex-col items-center gap-1 text-pixelAccent' : 'flex flex-col items-center gap-1 text-gray-400';
    }

    function setType(type) {
      currentType = type;
      const btnExp = document.getElementById('btnTypeExpense');
      const btnInc = document.getElementById('btnTypeIncome');
      if (type === '支出') {
        btnExp.className = 'text-xs py-1 px-3.5 rounded-lg font-medium transition bg-pixelRed text-white';
        btnInc.className = 'text-xs py-1 px-3.5 rounded-lg font-medium transition bg-gray-800 text-gray-300';
      } else {
        btnInc.className = 'text-xs py-1 px-3.5 rounded-lg font-medium transition bg-pixelAccent text-gray-950';
        btnExp.className = 'text-xs py-1 px-3.5 rounded-lg font-medium transition bg-gray-800 text-gray-300';
      }
    }

    function renderRecords() {
      const listEl = document.getElementById('recordList');
      listEl.innerHTML = '';

      let totalIn = 0;
      let totalOut = 0;

      records.forEach((rec) => {
        if (rec.type === '收入') totalIn += Number(rec.amount);
        else totalOut += Number(rec.amount);

        const card = document.createElement('div');
        card.className = 'bg-pixelCard p-3 rounded-lg border border-gray-800 flex items-center justify-between text-xs';
        
        card.innerHTML = `
          <div>
            <div class="font-medium text-gray-200 text-xs">${rec.category}</div>
            <div class="text-[10px] text-gray-400 mt-0.5">${rec.date} ${rec.note ? '• ' + rec.note : ''}</div>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-semibold ${rec.type === '收入' ? 'text-pixelAccent' : 'text-pixelRed'}">
              ${rec.type === '收入' ? '+' : '-'}$${Number(rec.amount).toLocaleString()}
            </span>
            <button onclick="deleteRecord(${rec.id})" class="text-gray-500 hover:text-red-400 text-xs px-1">✕</button>
          </div>
        `;
        listEl.appendChild(card);
      });

      document.getElementById('statIncome').innerText = `$ ${totalIn.toLocaleString()}`;
      document.getElementById('statExpense').innerText = `$ ${totalOut.toLocaleString()}`;
      document.getElementById('statBalance').innerText = `$ ${(totalIn - totalOut).toLocaleString()}`;
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      renderAll();
    }

    function renderBudget() {
      const totalOut = records.filter(r => r.type === '支出').reduce((sum, r) => sum + Number(r.amount), 0);
      const limit = budget.amount || 1;
      const percent = Math.min(Math.round((totalOut / limit) * 100), 100);

      document.getElementById('budgetUsedPercent').innerText = `${percent}%`;
      document.getElementById('budgetRemaining').innerText = Math.max(0, limit - totalOut).toLocaleString();
      
      const bar = document.getElementById('budgetProgressBar');
      bar.style.width = `${percent}%`;
      bar.className = percent > 90 ? 'bg-pixelRed h-full transition-all' : 'bg-pixelAccent h-full transition-all';
    }

    function openBudgetModal() {
      document.getElementById('budgetAmountInput').value = budget.amount;
      document.getElementById('budgetModal').classList.remove('hidden');
    }

    function closeBudgetModal() {
      document.getElementById('budgetModal').classList.add('hidden');
    }

    function saveBudget() {
      budget.amount = Number(document.getElementById('budgetAmountInput').value) || 0;
      closeBudgetModal();
      renderAll();
    }

    function renderCategoryChips() {
      const container = document.getElementById('categoryChips');
      container.innerHTML = '';

      if (categories.length === 0) return;

      if (!categories.some(c => c.name === selectedCategory)) {
        selectedCategory = categories[0].name;
      }

      categories.forEach(cat => {
        const chip = document.createElement('button');
        const isSelected = cat.name === selectedCategory;
        chip.type = 'button';
        chip.className = `px-3 py-1 rounded-lg text-xs font-medium border transition ${isSelected ? 'bg-pixelGold text-gray-950 border-pixelGold' : 'bg-gray-900 text-gray-300 border-gray-700'}`;
        chip.innerText = cat.name;
        chip.onclick = () => {
          selectedCategory = cat.name;
          renderCategoryChips();
        };
        container.appendChild(chip);
      });
    }

    function renderCategoryManagement() {
      const list = document.getElementById('categoryList');
      list.innerHTML = '';
      categories.forEach((cat, idx) => {
        const item = document.createElement('div');
        item.className = 'py-2.5 flex justify-between items-center text-xs';
        item.innerHTML = `
          <span class="text-gray-200 font-medium">${cat.name}</span>
          <button onclick="deleteCategory(${idx})" class="text-pixelRed hover:underline text-[11px]">刪除</button>
        `;
        list.appendChild(item);
      });
    }

    function addCustomCategory() {
      const input = document.getElementById('newCategoryInput');
      const val = input.value.trim();
      if (val && !categories.some(c => c.name === val)) {
        categories.push({ name: val });
        selectedCategory = val;
        input.value = '';
        renderAll();
      }
    }

    function deleteCategory(index) {
      categories.splice(index, 1);
      renderAll();
    }

    function renderChart() {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      const expRecords = records.filter(r => r.type === '支出');
      
      const catMap = {};
      expRecords.forEach(r => {
        catMap[r.category] = (catMap[r.category] || 0) + Number(r.amount);
      });

      const labels = Object.keys(catMap);
      const data = Object.values(catMap);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels.length ? labels : ['無數據'],
          datasets: [{
            data: data.length ? data : [1],
            backgroundColor: ['#F4A261', '#E63946', '#2A9D8F', '#E9C46A', '#52B788', '#A8DADC'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right', labels: { boxWidth: 8, font: { size: 10 }, color: '#9CA3AF' } }
          },
          cutout: '70%'
        }
      });
    }

    function openAddModal() {
      document.getElementById('inputAmount').value = '';
      document.getElementById('inputNote').value = '';
      renderCategoryChips();
      document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    function saveRecord() {
      const amount = Number(document.getElementById('inputAmount').value);
      if (!amount || amount <= 0) return;

      records.unshift({
        id: Date.now(),
        type: currentType,
        amount: amount,
        category: selectedCategory,
        date: document.getElementById('inputDate').value,
        note: document.getElementById('inputNote').value
      });

      farmState.feed += 1;
      
      if (farmState.eggDays > 0 && Math.random() > 0.5) {
        farmState.eggDays -= 1;
      }

      closeAddModal();
      renderAll();
      
      const toast = document.getElementById('farmToast');
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2000);
    }

    function exportCSV() {
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF日期,類型,類別,金額,備註\n";
      records.forEach(r => {
        csvContent += `${r.date},${r.type},${r.category},${r.amount},"${r.note || ''}"\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "dino_accounting_data.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
